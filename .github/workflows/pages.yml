name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/audio-decode-browser.mjs
      - run: node tests/built-worker.mjs
      - run: node tests/built-recorded-poses.mjs
      - run: node tests/built-rhythm-history.mjs
      - run: node tests/built-beat-editor.mjs
      - run: node tests/built-sync.mjs
      - run: node tests/built-camera.mjs
      - run: node tests/built-compact-ui.mjs
      - run: node tests/built-viewer.mjs
      - run: node tests/built-motion.mjs
      - run: node tests/built-background-worker.mjs
      - run: node tests/static-output.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
